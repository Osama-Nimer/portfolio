# Keeps the backend on Render's free tier awake: Render spins a free service
# down after ~15 minutes without traffic, so this pings it every 10 minutes.
#
# Setup: Settings → Secrets and variables → Actions → Variables, add
#   BACKEND_URL = your backend's API base, e.g. https://your-api.onrender.com/api
#
# GitHub may run scheduled jobs a few minutes late under load, and pauses
# schedules in a repository with no commits for 60 days (re-enable it from
# the Actions tab).
name: Keep backend awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend
        env:
          BACKEND_URL: ${{ vars.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "::warning::BACKEND_URL repository variable is not set; nothing to ping."
            exit 0
          fi
          # A cold start can take up to a minute, so allow a long timeout and a few retries.
          code=$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            "${BACKEND_URL%/}/tags")
          echo "Backend answered HTTP $code"
          [ "$code" -lt 500 ]
